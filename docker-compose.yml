name: openrwp

services:
  openrwp:
    build: ./backend
    container_name: openrwp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - openrwp-blobs:/data/blobs
    networks:
      - tws-proxy
      - poc_network

networks:
  tws-proxy:
    external: true
    name: tws-proxy
  poc_network:
    driver: bridge

volumes:
  openrwp-blobs: