name: openrwp

services:
  openrwp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openrwp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - openrwp-blobs:/data/blobs
    networks:
      - tws-proxy
      - poc_network

networks:
  tws-proxy:
    external: true
    name: tws-proxy
  poc_network:
    external: true
    name: poc-fragestunde_poc_network

volumes:
  openrwp-blobs: